name: Release

on:
  push:
    tags: ['v*']
    branches: [main]

permissions:
  contents: write

# Serialize version selection and publication so simultaneous merges do not
# choose the same next tag. Pending runs may coalesce to the newest main commit.
concurrency:
  group: dynar-release
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release version selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(python3 .github/scripts/release_version.py)"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go dependencies
        shell: bash
        run: |
          if ! go mod tidy; then
            echo "::warning::Public Go checksum service may still be indexing the newly published tailg tag. Bypassing it only for the user-owned tailg module."
            GONOSUMDB=github.com/fernandocpaz/tailg go mod tidy
          fi
      - name: Linux race tests
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Windows native tests
        if: runner.os == 'Windows'
        run: go test ./...
      - run: go vet ./...

  build:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64, ext: ''}
          - {goos: linux, goarch: arm64, ext: ''}
          - {goos: windows, goarch: amd64, ext: '.exe'}
          - {goos: windows, goarch: arm64, ext: '.exe'}
          - {goos: darwin, goarch: amd64, ext: ''}
          - {goos: darwin, goarch: arm64, ext: ''}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go dependencies
        shell: bash
        run: |
          if ! go mod tidy; then
            echo "::warning::Public Go checksum service may still be indexing the newly published tailg tag. Bypassing it only for the user-owned tailg module."
            GONOSUMDB=github.com/fernandocpaz/tailg go mod tidy
          fi
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          output="dist/dynar_${{ needs.metadata.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          commit="$(git rev-parse HEAD)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags="-s -w -X github.com/fernandocpaz/dynar/internal/app.Version=${{ needs.metadata.outputs.version }} -X github.com/fernandocpaz/dynar/internal/app.Commit=$commit -X github.com/fernandocpaz/dynar/internal/app.BuildTime=$build_time" -o "$output" ./cmd/dynar
      - uses: actions/upload-artifact@v4
        with:
          name: dynar-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  windows-installer:
    needs: [metadata, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dynar-windows-*
          path: dist
          merge-multiple: true
      - name: Build and test Windows setup
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.version }}
        run: |
          ./installer/windows/build.ps1 -AssetDir ./dist -OutputDir ./setup-dist -ReleaseTag $env:RELEASE_TAG
          ./installer/windows/smoke.ps1 -SetupPath ./setup-dist/DynaR-Setup.exe -ReleaseTag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: dynar-windows-installer
          path: setup-dist/DynaR-Setup.exe
          if-no-files-found: error

  release:
    needs: [metadata, validate, build, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dynar-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            Built from tested `main` commit `${{ github.sha }}`.

            **First installation on Windows:** download **DynaR-Setup.exe** from the assets below and run it. It contains both x64 and ARM64 binaries, installs for the current user and adds DynaR to PATH. No Go or tailg installation is required. Open a new terminal and run `dynar`.

            **Already installed:** run `dynar update`. Portable Windows, Linux, and macOS binaries remain available.

            The Windows setup is currently unsigned; Windows may display a publisher or SmartScreen warning.
          generate_release_notes: true
          tag_name: ${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
